<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPay - Gaming Donation Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Inter:wght@400;600;700&display=swap');
        :root { --p: #a855f7; --s: #06b6d4; --d: #020617; }
        body { background-color: var(--d); color: white; font-family: 'Inter', sans-serif; background-image: linear-gradient(rgba(2, 6, 23, 0.85), rgba(2, 6, 23, 0.95)), url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&q=80&w=2070'); background-size: cover; background-attachment: fixed; min-height: 100vh; }
        .cyber-font { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-btn { background: linear-gradient(90deg, var(--p), var(--s)); box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); transition: all 0.3s; }
        .neon-btn:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(6, 182, 212, 0.6); }
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .avatar-box { width: 65px; height: 65px; cursor: pointer; border: 2px solid transparent; border-radius: 12px; transition: 0.2s; background: rgba(255,255,255,0.05); }
        .avatar-box.selected { border-color: var(--s); box-shadow: 0 0 15px var(--s); }
        .game-tag { background: rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.3); color: #c084fc; font-size: 9px; font-weight: 800; padding: 2px 10px; border-radius: 6px; text-transform: uppercase; }
        .footer-icon-small { width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.2); object-fit: cover; }
        .game-checkbox { cursor: pointer; border: 1px solid rgba(255,255,255,0.1); padding: 8px 14px; border-radius: 10px; transition: all 0.2s; font-size: 11px; font-weight: 600; background: rgba(255,255,255,0.02); }
        .game-checkbox.selected { background: var(--p); border-color: var(--p); color: white; box-shadow: 0 0 10px var(--p); }
        .profile-img-card { width: 100px; height: 100px; object-fit: cover; border-radius: 24px; border: 2px solid var(--p); }
    </style>
</head>
<body class="pb-10 text-left text-white">

    <nav class="sticky top-0 z-50 glass border-b border-white/5 px-8 py-4 flex justify-between items-center">
        <div class="flex items-center gap-4 cursor-pointer" onclick="showView('home')">
            <div class="w-10 h-10 bg-gradient-to-br from-purple-600 to-cyan-500 rounded-lg flex items-center justify-center shadow-lg"><svg class="w-6 h-6" fill="white" viewBox="0 0 24 24"><path d="M7 4v16l13-8-13-8z"/></svg></div>
            <h1 class="cyber-font text-2xl font-black tracking-tighter uppercase">StreamPay</h1>
        </div>
        <div class="flex items-center gap-6 text-[10px] font-bold uppercase">
            <button onclick="showView('register')" class="text-slate-400 hover:text-white transition">Become Streamer</button>
            <button id="connectBtn" onclick="connectWallet()" class="glass px-6 py-2 rounded-full border border-white/10 hover:bg-white/5 transition">Connect Wallet</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 mt-16">
        <section id="homeView" class="view active">
            <div class="flex flex-col lg:flex-row justify-between items-end mb-16 gap-8">
                <div><h2 class="text-6xl font-black cyber-font mb-2 tracking-tighter uppercase">Streamers</h2></div>
                <div class="flex gap-4 w-full lg:w-auto">
                    <input type="text" id="searchInput" oninput="renderUI()" placeholder="Search username..." class="glass flex-1 lg:w-80 p-5 rounded-2xl outline-none text-sm text-white focus:border-cyan-500 transition">
                    <select id="gameFilter" onchange="renderUI()" class="glass p-5 rounded-2xl text-[10px] font-bold uppercase outline-none text-white cursor-pointer"><option value="All">All Games</option><option value="Dota 2">Dota 2</option><option value="League of Legends">League of Legends</option><option value="CS2">CS2</option><option value="FIFA">FIFA</option><option value="Call of Duty">Call of Duty</option></select>
                </div>
            </div>
            <div id="loadingStatus" class="text-center text-slate-500 font-bold uppercase tracking-widest my-20">Syncing with Arc Blockchain...</div>
            <div id="streamerList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10"></div>
        </section>

        <!-- REGISTER VIEW -->
        <section id="registerView" class="view max-w-2xl mx-auto">
            <div class="glass p-12 rounded-[3.5rem] shadow-2xl relative overflow-hidden">
                <h2 class="text-3xl font-black cyber-font mb-10 text-center uppercase tracking-tight text-left">Streamer Registration</h2>
                <form onsubmit="handleRegister(event)" class="space-y-10">
                    <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] block mb-6 text-center text-left">Select Character</label><div id="avatarPicker" class="grid grid-cols-5 gap-4 justify-items-center"></div></div>
                    <div class="grid grid-cols-2 gap-6 text-left">
                        <div class="space-y-2"><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-1">Unique Username</label><input type="text" id="regUser" required placeholder="handle" class="w-full glass p-5 rounded-2xl outline-none text-sm text-white"></div>
                        <div class="space-y-2"><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-1 text-nowrap">Arc Wallet Address</label><input type="text" id="regWallet" readonly class="w-full glass p-5 rounded-2xl outline-none text-[10px] font-mono opacity-60 text-white" placeholder="Connect Wallet First"></div>
                    </div>
                    <div class="space-y-4 text-left"><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-1">Select Games</label><div id="gameCheckboxes" class="flex flex-wrap gap-3"><div class="game-checkbox" onclick="toggleGame(this, 'Dota 2')">Dota 2</div><div class="game-checkbox" onclick="toggleGame(this, 'League of Legends')">League of Legends</div><div class="game-checkbox" onclick="toggleGame(this, 'CS2')">CS2</div><div class="game-checkbox" onclick="toggleGame(this, 'FIFA')">FIFA</div><div class="game-checkbox" onclick="toggleGame(this, 'Call of Duty')">Call of Duty</div></div></div>
                    <input type="text" id="regOtherGames" placeholder="Other Games (Optional)" class="w-full glass p-5 rounded-2xl outline-none text-sm text-white">
                    <div class="grid grid-cols-2 gap-6 text-xs text-white"><input type="url" id="regTwitch" placeholder="Twitch URL" class="glass p-5 rounded-2xl outline-none text-white"><input type="url" id="regKick" placeholder="Kick URL" class="glass p-5 rounded-2xl outline-none text-white"></div>
                    <button id="regBtn" type="submit" class="w-full neon-btn py-6 rounded-[1.5rem] font-black text-xs uppercase tracking-[0.3em] text-white">Sign & Register on Arc</button>
                </form>
            </div>
        </section>

        <!-- DONATE VIEW -->
        <section id="donateView" class="view max-w-5xl mx-auto">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 glass p-12 rounded-[4.5rem]">
                <div class="flex flex-col items-center space-y-10 text-center">
                    <button onclick="showView('home')" class="self-start text-[10px] font-bold text-slate-500 uppercase hover:text-white transition tracking-widest">← Back</button>
                    <img id="targetImg" src="" class="w-56 h-56 rounded-[3.5rem] border-2 border-purple-500 shadow-2xl object-cover shadow-purple-900/40 mx-auto">
                    <div class="text-center"><h2 id="targetName" class="text-5xl font-black cyber-font tracking-tighter uppercase">Creator</h2><div id="targetGames" class="flex flex-wrap justify-center gap-3 mt-6"></div></div>
                    <div class="flex gap-4 w-full text-white text-center"><a id="targetTwitch" href="#" target="_blank" class="flex-1 glass py-5 rounded-[1.5rem] text-[10px] font-bold uppercase tracking-widest hover:bg-purple-600 transition">Twitch</a><a id="targetKick" href="#" target="_blank" class="flex-1 glass py-5 rounded-[1.5rem] text-[10px] font-bold uppercase tracking-widest hover:bg-green-600 transition">Kick</a></div>
                </div>
                <div class="space-y-10 text-left">
                    <div class="glass p-10 rounded-[3.5rem] border-white/5 shadow-2xl text-white">
                        <div class="space-y-6">
                            <input type="text" id="donorName" placeholder="Donor Name (Optional)" class="w-full glass p-5 rounded-2xl outline-none text-sm text-white">
                            <div><label class="text-[10px] font-bold text-cyan-400 uppercase tracking-widest px-1">Amount (Min 0.01 USDC)</label><input type="number" id="tipAmount" min="0.01" step="0.01" placeholder="1.00" class="w-full glass p-6 rounded-2xl outline-none text-3xl font-black text-white"></div>
                            <textarea id="tipMsg" rows="3" placeholder="Message..." class="w-full glass p-5 rounded-2xl outline-none text-sm resize-none text-white"></textarea>
                            <button id="tipBtn" onclick="executeTip()" class="w-full neon-btn py-6 rounded-[1.5rem] font-black uppercase text-xs tracking-[0.3em] text-white">Donate Stream</button>
                        </div>
                    </div>
                    <div class="flex flex-col items-center">
                        <div id="qrcode" class="bg-white p-3 rounded-[1.5rem] shadow-xl"></div>
                        <button onclick="copyPayLink()" class="mt-6 text-[10px] font-bold text-cyan-400 uppercase tracking-widest hover:underline">Copy Donation Link</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="mt-40 border-t border-white/5 py-16 px-10 glass text-white text-left text-white">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-12 text-white text-left">
            <div class="flex items-center gap-10">
                <div class="flex items-center gap-3"><img src="https://i.postimg.cc/vT96JDNC/avatar.jpg" class="footer-icon-small"><p class="text-xs">Project by <b>amirrezaeian</b></p></div>
                <div class="flex items-center gap-3"><img src="https://i.postimg.cc/vHFnWL1s/arc-logo.jpg" class="footer-icon-small"><p class="text-[10px] uppercase font-bold text-slate-500 tracking-widest">Built on Arc Network™</p></div>
            </div>
            <div class="flex gap-12 text-[10px] font-bold uppercase text-slate-500 text-white"><a href="https://x.com/amirrezaeian75" target="_blank" class="hover:text-purple-400 transition text-white">Twitter (X)</a><a href="https://github.com/amirrezaeian1375/stream-donate-arc" target="_blank" class="hover:text-purple-400 transition text-white text-left">GitHub</a></div>
        </div>
        <div class="max-w-7xl mx-auto mt-16 text-center text-[9px] text-slate-700 leading-relaxed uppercase tracking-widest italic">Arc is a trademark of Circle Internet Group, Inc. StreamPay is an independent project.</div>
    </footer>

    <script>
        const contractAddress = "0x03D8d075aF53fE525F4d270bc1a70734F7F8d541";
        const arcChainId = "0x4cef52";
        const rpcUrl = "https://rpc.testnet.arc.network";
        const abi = [
            "function register(string memory _user, string[] memory _games, string memory _avatar) public",
            "function getStreamer(string memory _user) public view returns (tuple(string username, string[] games, string avatar, address wallet, bool isRegistered))",
            "function getStreamerCount() public view returns (uint256)",
            "function streamerList(uint256) public view returns (string)"
        ];

        const avatarSeeds = ["Aria", "Milo", "Kiki", "Leo", "Luna", "Jasper", "Nova", "Felix", "Nala", "Buster", "Zoe", "Finn", "Maya", "Oscar", "Cleo"];
        let selectedAvatar = "", selectedGames = [], userWallet = "", blockchainStreamers = [];

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    userWallet = accs[0];
                    document.getElementById('connectBtn').innerText = userWallet.substring(0,6) + "...";
                    if(document.getElementById('regWallet')) document.getElementById('regWallet').value = userWallet;
                    return true;
                } catch (e) { return false; }
            } else { alert("Install MetaMask!"); return false; }
        }

        async function fetchStreamers() {
            try {
                const provider = new ethers.providers.JsonRpcProvider(rpcUrl);
                const contract = new ethers.Contract(contractAddress, abi, provider);
                const count = await contract.getStreamerCount();
                let list = [];
                for(let i=0; i<count; i++) {
                    const username = await contract.streamerList(i);
                    const data = await contract.getStreamer(username);
                    list.push({ user: data.username, games: data.games, img: data.avatar, wallet: data.wallet });
                }
                blockchainStreamers = list;
                document.getElementById('loadingStatus').classList.add('hidden');
                renderUI();
            } catch (e) { document.getElementById('loadingStatus').innerText = "Sync Error. Check Arc Network."; }
        }

        function renderUI() {
            const s = document.getElementById('searchInput').value.toLowerCase();
            const f = document.getElementById('gameFilter').value;
            const l = document.getElementById('streamerList');
            const filtered = blockchainStreamers.filter(st => st.user.toLowerCase().includes(s) && (f === 'All' || st.games.includes(f)));
            l.innerHTML = filtered.length === 0 ? '<div class="col-span-full text-center text-slate-600 uppercase font-bold py-20 text-xs">No registered streamers yet.</div>' : filtered.map(st => `
                <div class="glass p-10 rounded-[3rem] text-center cursor-pointer group flex flex-col items-center hover:-translate-y-3 transition-all duration-500" onclick="openDonate('${st.user}')">
                    <img src="${st.img}" class="profile-img-card mb-8 group-hover:scale-110 transition duration-700 border-2 border-purple-500">
                    <h3 class="cyber-font font-black text-2xl mb-4 uppercase text-white tracking-tighter">${st.user}</h3>
                    <div class="flex flex-wrap justify-center gap-2 mb-10 text-white">${st.games.map(g => `<span class="game-tag">${g}</span>`).join('')}</div>
                    <button class="w-full py-4 rounded-2xl border border-white/10 text-[9px] font-black uppercase tracking-[0.2em] group-hover:bg-purple-600 transition-all text-white">Donate Stream</button>
                </div>`).join('');
        }

        async function handleRegister(e) {
            e.preventDefault(); if(!userWallet) { await connectWallet(); return; }
            const user = document.getElementById('regUser').value, btn = document.getElementById('regBtn');
            if (!selectedAvatar) return alert("Select a character!");
            let finalGames = [...selectedGames]; const other = document.getElementById('regOtherGames').value;
            if (other) finalGames.push(other); if (finalGames.length === 0) return alert("Select at least one game!");

            try {
                btn.innerText = "Processing Transaction..."; btn.disabled = true;
                const signer = (new ethers.providers.Web3Provider(window.ethereum)).getSigner();
                const contract = new ethers.Contract(contractAddress, abi, signer);
                const tx = await contract.register(user, finalGames, selectedAvatar);
                alert("Confirming on Arc Testnet..."); await tx.wait();
                alert("Success! Syncing list..."); await fetchStreamers(); showView('home');
            } catch (e) { alert("Registration failed! Check if username is taken."); }
            finally { btn.innerText = "Launch Profile on Arc Network"; btn.disabled = false; }
        }

        function openDonate(u) {
            const c = blockchainStreamers.find(st => st.user === u); if(!c) return;
            document.getElementById('targetName').innerText = c.user; document.getElementById('targetImg').src = c.img;
            document.getElementById('targetGames').innerHTML = c.games.map(g => `<span class="game-tag text-xs">${g}</span>`).join('');
            const url = window.location.origin + window.location.pathname + "?streamer=" + c.user;
            document.getElementById('qrcode').innerHTML = ""; new QRCode(document.getElementById("qrcode"), { text: url, width: 140, height: 140 });
            showView('donate'); window.history.replaceState({}, '', url);
        }

        async function executeTip() {
            if(!userWallet) { alert("Please connect your wallet first!"); await connectWallet(); return; }
            const amt = document.getElementById('tipAmount').value, sName = document.getElementById('targetName').innerText;
            if(amt < 0.01) return alert("Min donation is 0.01 USDC");
            try {
                const btn = document.getElementById('tipBtn'); btn.innerText = "Donating..."; btn.disabled = true;
                const provider = new ethers.providers.Web3Provider(window.ethereum); const signer = provider.getSigner();
                const contract = new ethers.Contract(contractAddress, abi, provider);
                // GET FRESH WALLET FROM BLOCKCHAIN
                const data = await contract.getStreamer(sName);
                if (!data.wallet || data.wallet === "0x0000000000000000000000000000000000000000") throw new Error("Wallet not found on chain");
                
                const tx = await signer.sendTransaction({ to: data.wallet, value: ethers.utils.parseEther(amt.toString()) });
                alert("Transaction pending on Arc..."); await tx.wait(); 
                alert("Thank you! You have successfully donated to " + sName + " ☕️");
            } catch (e) { alert("Error: " + e.message); }
            finally { document.getElementById('tipBtn').innerText = "Donate Stream"; document.getElementById('tipBtn').disabled = false; }
        }

        function showView(v) { document.querySelectorAll('.view').forEach(e => e.classList.remove('active')); document.getElementById(v + 'View').classList.add('active'); window.scrollTo({ top: 0, behavior: 'smooth' }); if(v === 'home') window.history.replaceState({}, '', window.location.pathname); }
        function toggleGame(el, g) { if (selectedGames.includes(g)) { selectedGames = selectedGames.filter(i => i !== g); el.classList.remove('selected'); } else { selectedGames.push(g); el.classList.add('selected'); } }
        function setupAvatarPicker() { document.getElementById('avatarPicker').innerHTML = avatarSeeds.map(s => { const u = `https://api.dicebear.com/7.x/adventurer/svg?seed=${s}`; return `<img src="${u}" class="avatar-box" onclick="selectAvatar(this, '${u}')">`; }).join(''); }
        function selectAvatar(el, u) { document.querySelectorAll('.avatar-box').forEach(i => i.classList.remove('selected')); el.classList.add('selected'); selectedAvatar = u; }
        function copyPayLink() { navigator.clipboard.writeText(window.location.href); alert("Link Copied!"); }
        window.onload = () => { setupAvatarPicker(); fetchStreamers(); const p = new URLSearchParams(window.location.search); if(p.has('streamer')) setTimeout(() => openDonate(p.get('streamer')), 1500); };
    </script>
</body>
</html>
