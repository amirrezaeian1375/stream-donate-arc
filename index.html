<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcStream - Decentralized Streaming & Donations</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --danger-color: #ef4444;
            --success-color: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--card-bg);
        }

        h1 {
            margin: 0;
            color: var(--accent-color);
            font-size: 1.8rem;
        }

        button {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: var(--text-secondary);
            cursor: not-allowed;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }

        .streamers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .streamer-card {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .streamer-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .streamer-addr {
            font-size: 0.8rem;
            color: var(--text-secondary);
            word-break: break-all;
            margin-bottom: 15px;
        }

        .status {
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .error { color: var(--danger-color); }
        .success { color: var(--success-color); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ArcStream</h1>
        <button id="connectBtn" onclick="connectWallet()">Connect Wallet</button>
    </header>

    <div class="card">
        <h2>Register as Streamer</h2>
        <div class="form-group">
            <label for="streamerName">Channel Name</label>
            <input type="text" id="streamerName" placeholder="Enter your channel name">
        </div>
        <button onclick="registerStreamer()">Register</button>
        <div id="regStatus" class="status"></div>
    </div>

    <h2>Active Streamers</h2>
    <div id="streamersList" class="streamers-grid">
        <p>Loading streamers from Arc Network...</p>
    </div>
</div>

<script>
    // Arc Testnet Configuration
    const ARC_RPC_URLS = [
        "https://rpc.testnet.arc.network",
        "https://rpc-testnet.arc.network"
    ];
    
    const CONTRACT_ADDRESS = "0x0000000000000000000000000000000000000000"; // Replace with your deployed contract address

    const ABI = [
        "function registerStreamer(string memory _name) public",
        "function donate(address payable _streamer) public payable",
        "function getStreamers() public view returns (address[] memory)",
        "function streamers(address) public view returns (string memory name, address wallet, uint256 totalDonations, bool isRegistered)"
    ];

    let provider;
    let signer;
    let contract;

    async function initProvider() {
        for (let rpc of ARC_RPC_URLS) {
            try {
                const tempProvider = new ethers.providers.JsonRpcProvider(rpc);
                await tempProvider.getNetwork();
                return tempProvider;
            } catch (e) {
                console.warn("RPC failed, trying next:", rpc);
            }
        }
        if (window.ethereum) {
            return new ethers.providers.Web3Provider(window.ethereum);
        }
        return null;
    }

    async function init() {
        try {
            provider = await initProvider();
            if (!provider) {
                document.getElementById('streamersList').innerHTML = '<p class="error">Could not connect to Arc Network RPC.</p>';
                return;
            }
            
            contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, provider);
            await loadStreamers();
        } catch (error) {
            console.error("Initialization error:", error);
            document.getElementById('streamersList').innerHTML = '<p class="error">Sync Error. Check network.</p>';
        }
    }

    async function connectWallet() {
        if (window.ethereum) {
            try {
                await window.ethereum.request({ method: 'eth_requestAccounts' });
                const web3Provider = new ethers.providers.Web3Provider(window.ethereum);
                signer = web3Provider.getSigner();
                const address = await signer.getAddress();
                document.getElementById('connectBtn').innerText = address.substring(0, 6) + '...' + address.substring(38);
                contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
            } catch (error) {
                console.error("User denied account access", error);
            }
        } else {
            alert('Please install MetaMask or an Ethereum compatible browser wallet!');
        }
    }

    async function registerStreamer() {
        const name = document.getElementById('streamerName').value;
        const statusDiv = document.getElementById('regStatus');
        
        if (!name) {
            statusDiv.className = "status error";
            statusDiv.innerText = "Please enter a channel name.";
            return;
        }

        if (!signer) {
            statusDiv.className = "status error";
            statusDiv.innerText = "Please connect your wallet first.";
            return;
        }

        try {
            statusDiv.className = "status";
            statusDiv.innerText = "Transaction pending...";
            const tx = await contract.registerStreamer(name);
            await tx.wait();
            statusDiv.className = "status success";
            statusDiv.innerText = "Successfully registered!";
            loadStreamers();
        } catch (error) {
            console.error(error);
            statusDiv.className = "status error";
            statusDiv.innerText = "Registration failed. " + (error.reason || error.message);
        }
    }

    async function donate(streamerAddress) {
        if (!signer) {
            alert("Please connect your wallet to donate.");
            return;
        }

        const amount = prompt("Enter donation amount in ARC:");
        if (!amount || isNaN(amount) || parseFloat(amount) <= 0) return;

        try {
            const tx = await contract.donate(streamerAddress, {
                value: ethers.utils.parseEther(amount)
            });
            await tx.wait();
            alert("Donation successful! Thank you for supporting!");
            loadStreamers();
        } catch (error) {
            console.error(error);
            alert("Donation failed: " + (error.reason || error.message));
        }
    }

    async function loadStreamers() {
        const listContainer = document.getElementById('streamersList');
        try {
            const streamerAddresses = await contract.getStreamers();
            
            if (!streamerAddresses || streamerAddresses.length === 0) {
                listContainer.innerHTML = '<p>No registered streamers found.</p>';
                return;
            }

            listContainer.innerHTML = '';

            for (let addr of streamerAddresses) {
                try {
                    const streamer = await contract.streamers(addr);
                    if (streamer && streamer.isRegistered) {
                        const card = document.createElement('div');
                        card.className = 'streamer-card';
                        
                        const formattedDonations = ethers.utils.formatEther(streamer.totalDonations || 0);

                        card.innerHTML = `
                            <div>
                                <div class="streamer-name">${escapeHtml(streamer.name)}</div>
                                <div class="streamer-addr">${addr}</div>
                                <div>Total Received: <strong>${formattedDonations} ARC</strong></div>
                            </div>
                            <button style="margin-top: 15px;" onclick="donate('${addr}')">Donate ARC</button>
                        `;
                        listContainer.appendChild(card);
                    }
                } catch (err) {
                    console.error("Error fetching individual streamer data:", err);
                }
            }
        } catch (error) {
            console.error("Error loading streamers:", error);
            listContainer.innerHTML = '<p class="error">Sync Error. Check network connections/RPC.</p>';
        }
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
