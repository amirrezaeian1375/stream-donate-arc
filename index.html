<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPay - Gaming Donation Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Inter:wght@400;600;700&display=swap');
        :root { --p: #a855f7; --s: #06b6d4; --d: #020617; }
        body { background-color: var(--d); color: white; font-family: 'Inter', sans-serif; background-image: linear-gradient(rgba(2, 6, 23, 0.85), rgba(2, 6, 23, 0.95)), url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&q=80&w=2070'); background-size: cover; background-attachment: fixed; min-height: 100vh; }
        .cyber-font { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-btn { background: linear-gradient(90deg, var(--p), var(--s)); box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); transition: all 0.3s; }
        .neon-btn:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(6, 182, 212, 0.6); }
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .avatar-box { width: 65px; height: 65px; cursor: pointer; border: 2px solid transparent; border-radius: 12px; transition: 0.2s; background: rgba(255,255,255,0.05); }
        .avatar-box.selected { border-color: var(--s); box-shadow: 0 0 15px var(--s); background: rgba(6, 182, 212, 0.1); }
        .game-tag { background: rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.3); color: #c084fc; font-size: 9px; font-weight: 800; padding: 2px 10px; border-radius: 6px; text-transform: uppercase; }
        .footer-icon-small { width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.2); object-fit: cover; }
        .game-checkbox { cursor: pointer; border: 1px solid rgba(255,255,255,0.1); padding: 8px 14px; border-radius: 10px; transition: all 0.2s; font-size: 11px; font-weight: 600; background: rgba(255,255,255,0.02); }
        .game-checkbox.selected { background: var(--p); border-color: var(--p); color: white; box-shadow: 0 0 10px var(--p); }
        .profile-img-card { width: 110px; height: 110px; object-fit: cover; border-radius: 28px; border: 2px solid var(--p); }
    </style>
</head>
<body class="pb-10 text-left">

    <nav class="sticky top-0 z-50 glass border-b border-white/5 px-8 py-4 flex justify-between items-center text-white">
        <div class="flex items-center gap-4 cursor-pointer" onclick="showView('home')">
            <div class="w-10 h-10 bg-gradient-to-br from-purple-600 to-cyan-500 rounded-lg flex items-center justify-center shadow-lg"><svg class="w-6 h-6" fill="white" viewBox="0 0 24 24"><path d="M7 4v16l13-8-13-8z"/></svg></div>
            <h1 class="cyber-font text-2xl font-black tracking-tighter uppercase">StreamPay</h1>
        </div>
        <div class="flex items-center gap-6 text-[10px] font-bold uppercase">
            <button onclick="showView('register')" class="text-slate-400 hover:text-white transition">Become Streamer</button>
            <button id="connectBtn" onclick="connectWallet()" class="glass px-6 py-2 rounded-full border border-white/10 hover:bg-white/5 transition">Connect Wallet</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 mt-16 text-left">
        <section id="homeView" class="view active text-white">
            <div class="flex flex-col lg:flex-row justify-between items-end mb-16 gap-8">
                <div>
                    <h2 class="text-6xl font-black cyber-font mb-2 tracking-tighter uppercase">Streamers</h2>
                </div>
                <div class="flex gap-4 w-full lg:w-auto">
                    <div class="relative flex-1 lg:w-80"><input type="text" id="searchInput" oninput="renderStreamers()" placeholder="Search username..." class="w-full glass p-5 rounded-2xl outline-none text-sm text-white focus:border-cyan-500 transition"></div>
                    <select id="gameFilter" onchange="renderStreamers()" class="glass p-5 rounded-2xl text-[10px] font-bold uppercase outline-none text-white cursor-pointer"><option value="All">All Games</option><option value="Dota 2">Dota 2</option><option value="League of Legends">League of Legends</option><option value="CS2">CS2</option><option value="FIFA">FIFA</option><option value="Call of Duty">Call of Duty</option></select>
                </div>
            </div>
            <div id="streamerList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10"></div>
        </section>

        <section id="registerView" class="view max-w-2xl mx-auto text-white">
            <div class="glass p-12 rounded-[3.5rem] shadow-2xl relative overflow-hidden">
                <h2 class="text-3xl font-black cyber-font mb-10 text-center uppercase tracking-tight">Streamer Registration</h2>
                <form onsubmit="handleRegister(event)" class="space-y-10">
                    <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] block mb-6 text-center text-left">Select Character</label><div id="avatarPicker" class="grid grid-cols-5 gap-4 justify-items-center"></div></div>
                    <div class="grid grid-cols-2 gap-6"><div class="space-y-2 text-left"><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-1">Unique Username</label><input type="text" id="regUser" required placeholder="handle" class="w-full glass p-5 rounded-2xl outline-none text-sm"></div><div class="space-y-2 text-left"><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-1 text-nowrap">Your Arc Wallet</label><input type="text" id="regWallet" readonly class="w-full glass p-5 rounded-2xl outline-none text-[10px] font-mono opacity-60" placeholder="Connect Wallet First"></div></div>
                    <div class="space-y-4 text-left text-white"><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-1">Select Games</label><div id="gameCheckboxes" class="flex flex-wrap gap-3"><div class="game-checkbox" onclick="toggleGame(this, 'Dota 2')">Dota 2</div><div class="game-checkbox" onclick="toggleGame(this, 'League of Legends')">League of Legends</div><div class="game-checkbox" onclick="toggleGame(this, 'CS2')">CS2</div><div class="game-checkbox" onclick="toggleGame(this, 'FIFA')">FIFA</div><div class="game-checkbox" onclick="toggleGame(this, 'Call of Duty')">Call of Duty</div></div></div>
                    <div class="space-y-2 text-left text-white"><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-1">Other Games</label><input type="text" id="regOtherGames" placeholder="e.g. Minecraft, Valorant" class="w-full glass p-5 rounded-2xl outline-none text-sm text-white"></div>
                    <div class="grid grid-cols-2 gap-6 text-xs text-white"><input type="url" id="regTwitch" placeholder="Twitch URL" class="glass p-5 rounded-2xl outline-none text-white"><input type="url" id="regKick" placeholder="Kick URL" class="glass p-5 rounded-2xl outline-none text-white"></div>
                    <button id="regBtn" type="submit" class="w-full neon-btn py-6 rounded-[1.5rem] font-black text-xs uppercase tracking-[0.3em]">Launch Profile on Arc Network</button>
                </form>
            </div>
        </section>

        <section id="donateView" class="view max-w-5xl mx-auto">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 glass p-12 rounded-[4.5rem] text-white">
                <div class="flex flex-col items-center space-y-10 text-center text-white">
                    <button onclick="showView('home')" class="self-start text-[10px] font-bold text-slate-500 uppercase hover:text-white transition tracking-widest">← Back</button>
                    <img id="targetImg" src="" class="w-56 h-56 rounded-[3.5rem] border-2 border-purple-500 shadow-2xl object-cover shadow-purple-900/40">
                    <div class="text-center">
                        <h2 id="targetName" class="text-5xl font-black cyber-font tracking-tighter uppercase">Creator</h2>
                        <div id="targetGames" class="flex flex-wrap justify-center gap-3 mt-6"></div>
                    </div>
                    <div class="flex gap-4 w-full text-white text-center"><a id="targetTwitch" href="#" target="_blank" class="flex-1 glass py-5 rounded-[1.5rem] text-[10px] font-bold uppercase tracking-widest hover:bg-purple-600 transition">Twitch</a><a id="targetKick" href="#" target="_blank" class="flex-1 glass py-5 rounded-[1.5rem] text-[10px] font-bold uppercase tracking-widest hover:bg-green-600 transition">Kick</a></div>
                </div>
                <div class="space-y-10 text-left">
                    <div class="glass p-10 rounded-[3.5rem] border-white/5 shadow-2xl">
                        <div class="space-y-6">
                            <input type="text" id="donorName" placeholder="Donor Name (Optional)" class="w-full glass p-5 rounded-2xl outline-none text-sm text-white">
                            <div><label class="text-[10px] font-bold text-cyan-400 uppercase tracking-widest px-1">Amount (Min 0.01 USDC)</label><input type="number" id="tipAmount" min="0.01" step="0.01" placeholder="1.00" class="w-full glass p-6 rounded-2xl outline-none text-3xl font-black text-white"></div>
                            <textarea id="tipMsg" rows="3" placeholder="Write a message..." class="w-full glass p-5 rounded-2xl outline-none text-sm resize-none text-white"></textarea>
                            <button onclick="executeTip()" class="w-full neon-btn py-6 rounded-[1.5rem] font-black uppercase text-xs tracking-[0.3em] text-white">Donate Stream</button>
                        </div>
                    </div>
                    <div class="flex flex-col items-center">
                        <div id="qrcode" class="bg-white p-3 rounded-[1.5rem] shadow-xl"></div>
                        <button onclick="copyPayLink()" class="mt-6 text-[10px] font-bold text-cyan-400 uppercase tracking-widest hover:underline">Copy Donation Link</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="mt-40 border-t border-white/5 py-16 px-10 glass text-white text-left">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-12 text-white">
            <div class="flex items-center gap-10">
                <div class="flex items-center gap-3">
                    <img id="footerAvatar" src="https://i.postimg.cc/vT96JDNC/avatar.jpg" class="footer-icon-small">
                    <p class="text-xs text-slate-400">Project by <b>amirrezaeian</b></p>
                </div>
                <div class="w-px h-8 bg-white/10"></div>
                <div class="flex items-center gap-3">
                    <img id="footerArc" src="https://i.postimg.cc/vHFnWL1s/arc-logo.jpg" class="footer-icon-small">
                    <p class="text-[10px] uppercase font-bold text-slate-500 tracking-widest">Built on Arc Network™</p>
                </div>
            </div>
            <div class="flex gap-12 text-[10px] font-bold uppercase text-slate-500"><a href="https://x.com/amirrezaeian75" target="_blank" class="hover:text-purple-400 transition text-white">Twitter (X)</a><a href="https://github.com/amirrezaeian1375/stream-donate-arc" target="_blank" class="hover:text-purple-400 transition text-white">GitHub</a></div>
        </div>
        <div class="max-w-7xl mx-auto mt-16 text-center text-[9px] text-slate-700 leading-relaxed uppercase tracking-widest italic">Arc is a trademark of Circle Internet Group, Inc. StreamPay is an independent project.</div>
    </footer>

    <script>
        const contractAddress = "0x03D8d075aF53fE525F4d270bc1a70734F7F8d541";
        const arcChainId = "0x4cef52"; 
        const abi = [
            "function register(string memory _user, string[] memory _games, string memory _avatar) public",
            "function getStreamer(string memory _user) public view returns (tuple(string username, string[] games, string avatar, address wallet, bool isRegistered))",
            "function getStreamerCount() public view returns (uint256)",
            "function streamerList(uint256) public view returns (string)"
        ];
        const avatarSeeds = ["Aria", "Milo", "Kiki", "Leo", "Luna", "Jasper", "Nova", "Felix", "Nala", "Buster", "Zoe", "Finn", "Maya", "Oscar", "Cleo"];
        let selectedAvatar = "", selectedGames = [], userWallet = "";
        
        let fallbackStreamers = [
            { user: "amirrezaeian", games: ["Dota 2", "FIFA"], img: "https://api.dicebear.com/7.x/adventurer/svg?seed=Aria", wallet: "0x562639eAA3e16199F29206f3f57aD3daD5903ac4", twitch: "#", kick: "#" }
        ];

        async function connectWallet() {
            if (!window.ethereum) {
                alert("Please install MetaMask!");
                return false;
            }

            try {
                const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userWallet = accs[0];

                const currentChainId = await window.ethereum.request({ method: 'eth_chainId' });
                
                if (currentChainId.toLowerCase() !== arcChainId.toLowerCase()) {
                    try {
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: arcChainId }],
                        });
                    } catch (switchError) {
                        if (switchError.code === 4902) {
                            try {
                                await window.ethereum.request({
                                    method: 'wallet_addEthereumChain',
                                    params: [{
                                        chainId: arcChainId,
                                        chainName: 'Arc Testnet',
                                        rpcUrls: ['https://rpc.testnet.arc.network'],
                                        nativeCurrency: {
                                            name: 'Arc',
                                            symbol: 'ARC', 
                                            decimals: 18
                                        },
                                        blockExplorerUrls: ['https://explorer.testnet.arc.network']
                                    }],
                                });
                            } catch (addError) {
                                alert("Failed to add Arc Testnet to MetaMask: " + addError.message);
                                return false;
                            }
                        } else {
                            alert("Failed to switch network: " + switchError.message);
                            return false;
                        }
                    }
                }

                document.getElementById('connectBtn').innerText = userWallet.substring(0,6) + "...";
                if(document.getElementById('regWallet')) document.getElementById('regWallet').value = userWallet;
                return true;

            } catch (e) {
                alert("Wallet connection error: " + e.message);
                return false;
            }
        }

        function showView(v) { 
            document.querySelectorAll('.view').forEach(e => e.classList.remove('active')); 
            document.getElementById(v + 'View').classList.add('active'); 
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if(v === 'home') window.history.replaceState({}, '', window.location.pathname);
        }

        function toggleGame(el, g) {
            if (selectedGames.includes(g)) { selectedGames = selectedGames.filter(i => i !== g); el.classList.remove('selected'); }
            else { selectedGames.push(g); el.classList.add('selected'); }
        }

        async function fetchOnChainStreamers() {
            try {
                const provider = new ethers.providers.JsonRpcProvider("https://rpc.testnet.arc.network");
                const contract = new ethers.Contract(contractAddress, abi, provider);
                const count = await contract.getStreamerCount();
                let list = [];
                for(let i=0; i<count; i++) {
                    const user = await contract.streamerList(i);
                    const data = await contract.getStreamer(user);
                    list.push({
                        user: data.username,
                        games: data.games,
                        img: data.avatar,
                        wallet: data.wallet,
                        twitch: "#",
                        kick: "#"
                    });
                }
                return list;
            } catch(e) {
                console.error("Failed to fetch on-chain data, using fallback:", e);
                return fallbackStreamers;
            }
        }
        
        async function renderStreamers() {
            const s = document.getElementById('searchInput').value.toLowerCase(), f = document.getElementById('gameFilter').value, l = document.getElementById('streamerList');
            l.innerHTML = "<div class='text-center text-slate-400 col-span-full py-10'>Syncing with Arc Network...</div>";
            
            const onChainData = await fetchOnChainStreamers();
            
            const filtered = onChainData.filter(st => st.user.toLowerCase().includes(s) && (f === 'All' || st.games.includes(f)));
            if(filtered.length === 0) {
                l.innerHTML = "<div class='text-center text-slate-500 col-span-full py-10'>No Streamers Found</div>";
                return;
            }

            l.innerHTML = filtered.map(st => `
                <div class="glass p-10 rounded-[3rem] text-center cursor-pointer group flex flex-col items-center hover:-translate-y-3 transition-all duration-500" onclick="openDonate('${st.user}')">
                    <img src="${st.img}" class="profile-img-card mb-8 group-hover:scale-110 transition duration-700 border-2 border-purple-500">
                    <h3 class="cyber-font font-black text-2xl mb-4 uppercase text-white tracking-tighter">${st.user}</h3>
                    <div class="flex flex-wrap justify-center gap-2 mb-10">${st.games.map(g => `<span class="game-tag">${g}</span>`).join('')}</div>
                    <button class="w-full py-4 rounded-2xl border border-white/10 text-[9px] font-black uppercase tracking-[0.2em] group-hover:bg-purple-600 transition-all text-white">Donate Stream</button>
                </div>
            `).join('');
        }

        async function handleRegister(e) {
            e.preventDefault();
            if(!userWallet) { const connected = await connectWallet(); if(!connected) return; }
            const user = document.getElementById('regUser').value;
            const btn = document.getElementById('regBtn');
            
            if (!selectedAvatar) return alert("Select a character!");
            let finalGames = [...selectedGames]; const other = document.getElementById('regOtherGames').value;
            if (other) finalGames.push(other); if (finalGames.length === 0) return alert("Select at least one game!");

            try {
                btn.innerText = "Processing Transaction..."; btn.disabled = true;
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const signer = provider.getSigner();
                const contract = new ethers.Contract(contractAddress, abi, signer);
                
                const tx = await contract.register(user, finalGames, selectedAvatar);
                alert("Transaction Broadcasted! Confirming on Arc Testnet..."); 
                await tx.wait();
                
                alert("Success! Profile permanently active on Arc Network.");
                await renderStreamers(); 
                showView('home');
            } catch (e) { 
                alert("Registration failed! Unique username or wallet might be already taken."); 
            } finally { 
                btn.innerText = "Launch Profile on Arc Network"; btn.disabled = false; 
            }
        }

        async function openDonate(u) {
            const onChainData = await fetchOnChainStreamers();
            const c = onChainData.find(st => st.user.toLowerCase() === u.toLowerCase());
            if(!c) return;
            
            document.getElementById('targetName').innerText = c.user; document.getElementById('targetImg').src = c.img;
            document.getElementById('targetTwitch').href = c.twitch; document.getElementById('targetKick').href = c.kick;
            document.getElementById('targetGames').innerHTML = c.games.map(g => `<span class="game-tag text-xs">${g}</span>`).join('');
            
            const url = window.location.origin + window.location.pathname + "?streamer=" + c.user;
            document.getElementById('qrcode').innerHTML = ""; 
            new QRCode(document.getElementById("qrcode"), { text: url, width: 140, height: 140 });
            
            showView('donate'); 
            window.history.replaceState({}, '', url);
        }

        async function executeTip() {
            if(!userWallet) { const connected = await connectWallet(); if(!connected) return; }
            const amt = document.getElementById('tipAmount').value, sName = document.getElementById('targetName').innerText;
            if(amt < 0.01) return alert("Min donation is 0.01 USDC");
            
            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum); 
                const signer = provider.getSigner(); 
                const onChainData = await fetchOnChainStreamers();
                const st = onChainData.find(s => s.user === sName);
                
                const parsedAmount = ethers.utils.parseUnits(amt.toString(), 6);
                
                const tx = await signer.sendTransaction({ 
                    to: st.wallet, 
                    value: parsedAmount 
                });
                
                alert("Donation pending on Arc Network..."); 
                await tx.wait();
                alert("Thank you! You have successfully donated to " + sName + " ☕️");
            } catch (e) { 
                alert("Donation Failed! Check your Arc Testnet USDC balance."); 
            }
        }

        function copyPayLink() { navigator.clipboard.writeText(window.location.origin + window.location.pathname + "?streamer=" + document.getElementById('targetName').innerText); alert("Donation Link Copied!"); }
        function setupAvatarPicker() { document.getElementById('avatarPicker').innerHTML = avatarSeeds.map(s => { const u = `https://api.dicebear.com/7.x/adventurer/svg?seed=${s}`; return `<img src="${u}" class="avatar-box" onclick="selectAvatar(this, '${u}')">`; }).join(''); }
        function selectAvatar(el, u) { document.querySelectorAll('.avatar-box').forEach(i => i.classList.remove('selected')); el.classList.add('selected'); selectedAvatar = u; }
        
        window.onload = () => { 
            setupAvatarPicker(); 
            renderStreamers(); 
            const p = new URLSearchParams(window.location.search); 
            if(p.has('streamer')) openDonate(p.get('streamer')); 
        };
    </script>
</body>
</html>
